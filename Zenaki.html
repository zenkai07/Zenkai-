<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zenaki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@400;600;700&display=swap">
<style>
/* Layout: bottom menu on phones, left rail on desktop; 2-column masonry feed with captions; themes recolour every token from JS */
:root{
  --bg:#0a0b0a; --surface:#131514; --surface2:#1e2120; --fg:#eef6f2; --muted:#9bb0a7;
  --line:rgba(255,255,255,.1); --accent:#6fe5b4; --accent2:#7fd8ef; --accent-fg:#06140e; --danger:#ff6b81;
  --shadow:0 18px 50px rgba(0,0,0,.5);
  --f-display:"Unbounded","Trebuchet MS",sans-serif; --f-body:"Manrope",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f4f7f5; --surface:#ffffff; --surface2:#e9efec; --fg:#0f1a15; --muted:#566a60;
  --line:rgba(10,30,20,.12); --accent:#0e9a68; --accent2:#1e86a3; --accent-fg:#ffffff; --danger:#d6334f;
  --shadow:0 18px 50px rgba(20,60,40,.18); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f4f7f5; --surface:#ffffff; --surface2:#e9efec; --fg:#0f1a15; --muted:#566a60;
  --line:rgba(10,30,20,.12); --accent:#0e9a68; --accent2:#1e86a3; --accent-fg:#ffffff; --danger:#d6334f;
  --shadow:0 18px 50px rgba(20,60,40,.18); color-scheme:light}
:root[data-theme="dark"]{
  --bg:#0a0b0a; --surface:#131514; --surface2:#1e2120; --fg:#eef6f2; --muted:#9bb0a7;
  --line:rgba(255,255,255,.1); --accent:#6fe5b4; --accent2:#7fd8ef; --accent-fg:#06140e; --danger:#ff6b81;
  --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 92px}
@media(min-width:900px){body{padding-left:calc(16px + 88px);padding-bottom:48px}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
h5{margin:0}
.col{min-width:0;max-width:1700px;margin-inline:auto}
.row{display:flex;flex-wrap:wrap;gap:8px}
.stat{color:var(--muted);font-size:13px}

/* boot */
#boot{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .6s,visibility .6s}
#boot.gone{opacity:0;visibility:hidden}
#boot .in{display:grid;gap:22px;justify-items:center}
.ring{position:relative;width:132px;height:132px}
.ring img{position:absolute;inset:16px;width:100px;height:100px;border-radius:50%;object-fit:cover;animation:fade 1s both}
.ring svg{position:absolute;inset:0;width:100%;height:100%;fill:none}
#boot circle{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300;transform-origin:50% 50%;transform:rotate(-70deg);animation:draw 1.2s cubic-bezier(.6,0,.2,1) forwards}
#boot b{font-family:var(--f-display);font-weight:600;letter-spacing:.3em;font-size:14px;text-indent:.3em;animation:fade 1s .4s both}
@keyframes draw{to{stroke-dashoffset:48}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

/* main menu: bottom bar on phones, left rail on desktop */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;align-items:center;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.nb{position:relative;display:grid;place-items:center;align-content:center;gap:2px;width:60px;height:50px;border-radius:16px;color:var(--muted);transition:color .15s,transform .15s}
.nb svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nb .lbl{display:none;font-size:11px;font-weight:600}
.nb.on{color:var(--fg)}
.nb.on svg{stroke-width:2.4}
.nb.on svg.fl{fill:currentColor}
.nb:active{transform:scale(.92)}
.nb .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-fg);display:grid;place-items:center;font-weight:800;font-size:14px;font-family:var(--f-display)}
.nb.on .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.nb .dot{position:absolute;top:7px;right:13px;width:11px;height:11px;border-radius:50%;background:var(--accent2);border:2px solid var(--bg)}
.nav .logo,.nav .sp,.nb.sett{display:none}
.nav .logo img,.tlogo img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 0 2px var(--accent)}
.tlogo{flex:none;width:34px;height:34px;margin:0 2px 5px 2px;border-radius:50%}
@media(min-width:900px){.tlogo{display:none}}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.brand img{width:52px;height:52px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--accent)}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:700}
@media(min-width:900px){
  .nav{top:0;right:auto;width:88px;flex-direction:column;justify-content:flex-start;gap:4px;padding:calc(14px + env(safe-area-inset-top,0px)) 8px 14px;border-top:0;border-right:1px solid var(--line)}
  .nav .logo{display:block;width:50px;height:50px;margin:4px 0 12px}
  .nb{width:70px;height:62px}
  .nb .lbl{display:block}
  .nav .sp{display:block;flex:1}
  .nb.sett{display:grid}
  .nb .dot{right:18px}
}

/* top tabs (like the screenshot: bold text with underline) */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin-inline:-16px;padding:8px 16px 0;background:var(--bg);display:flex;align-items:flex-end;gap:10px}
.ttabs{display:flex;gap:24px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.ttabs::-webkit-scrollbar{display:none}
.ttabs button{flex:none;padding:10px 0 8px;font-weight:700;font-size:17px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.ttabs button.on{color:var(--fg);border-bottom-color:var(--fg)}
.zb{flex:none;width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;margin-bottom:5px}
.zb svg{width:20px;height:20px}

.btn{height:44px;padding-inline:18px;border-radius:999px;background:var(--surface2);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{height:36px;padding-inline:14px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn svg{width:18px;height:18px}
.ibtn{width:42px;height:42px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.ibtn svg{width:20px;height:20px}
.avatar{width:44px;height:44px;border-radius:50%;color:#fff;font-weight:800;display:grid;place-items:center;font-family:var(--f-display);font-size:15px;flex:none;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.avatar.sm{width:38px;height:38px;font-size:13px}
.avatar.xl{width:96px;height:96px;font-size:34px}
.avatar.sys{background:var(--surface2);color:var(--accent)}
.avatar.sys svg{width:22px;height:22px}

/* feed */
.grid{columns:2;column-gap:10px;margin-top:10px}
@media(min-width:600px){.grid{columns:3}}
@media(min-width:900px){.grid{columns:4}}
@media(min-width:1250px){.grid{columns:5}}
@media(min-width:1600px){.grid{columns:6}}
.pin{break-inside:avoid;margin-bottom:14px;cursor:pointer;animation:rise .5s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.media{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:var(--ar);background:var(--surface2);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.media>svg,.media>img,.media>video{width:100%;height:100%;object-fit:cover;display:block}
@media(hover:hover){.pin:hover .media{transform:translateY(-3px)}.pin:hover .media>svg{animation:pan 9s ease-in-out infinite alternate}}
.pin.vid .media>svg{animation:pan 14s ease-in-out infinite alternate}
@keyframes pan{to{transform:scale(1.08) translateX(-1.5%)}}
.slides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.slides::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;height:100%;scroll-snap-align:center}
.sl>*{width:100%;height:100%;object-fit:cover;display:block}
.vbadge{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:3px 11px;font-weight:700;font-size:13px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tbadge{position:absolute;left:12px;bottom:12px;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:3px 11px;font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.pin .save{display:none;position:absolute;right:10px;top:10px;height:36px;padding-inline:16px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:13px}
.pin .save.on{background:#fff;color:#111}
@media(hover:hover){.pin:hover .save,.pin:focus-within .save{display:block}}
.dots{display:flex;justify-content:center;gap:7px;margin-top:9px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.55;transition:.2s}
.dots i.on{background:var(--fg);opacity:1;transform:scale(1.2)}
.cap{display:flex;align-items:center;gap:4px;margin-top:4px;padding-left:6px;min-height:36px}
.cap .ttl{flex:1;min-width:0;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.mb svg{width:22px;height:22px}
.empty{text-align:center;color:var(--muted);padding:70px 16px;display:grid;gap:12px;justify-items:center}
.empty b{display:block;font-family:var(--f-display);color:var(--fg);font-size:19px;font-weight:600}
#sentinel{height:60px;text-align:center;color:var(--muted);font-size:13px;padding-top:14px}

/* page headers */
.ph{display:flex;align-items:center;gap:10px;padding-block:14px 6px}
.ph h2{font-family:var(--f-display);font-size:clamp(19px,3vw,25px);margin:0;font-weight:600;flex:1;min-width:0}
.head{margin-block:18px 4px}
.head h2{font-family:var(--f-display);font-size:clamp(18px,3vw,26px);margin:0;text-wrap:balance;font-weight:600}
.head p{color:var(--muted);margin:4px 0 0}
.sec{font-family:var(--f-display);font-size:14px;font-weight:600;margin:26px 0 12px}
.sec small{font-family:var(--f-body);font-weight:500;color:var(--muted);margin-left:6px}
.sbar{position:relative;flex:1;min-width:0}
.sbar input{width:100%;height:50px;border-radius:999px;border:0;background:var(--surface2);padding-inline:50px 48px;font-size:16px}
.sbar input::placeholder{color:var(--muted)}
.sbar .ic{position:absolute;left:18px;top:15px;width:20px;height:20px;color:var(--muted)}
.sbar .sx{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.sbar .sx svg{width:14px;height:14px}
.chip{flex:none;padding:8px 15px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:700;color:var(--fg)}
.chip.on{background:var(--accent);color:var(--accent-fg)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:4/3;text-align:left;color:#fff;background:var(--surface2)}
.tile svg{position:absolute;inset:0;width:100%;height:100%}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.55))}
.tile span{position:absolute;z-index:1;left:12px;bottom:10px;font-family:var(--f-display);font-weight:600;font-size:14px}
.crow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.cc{flex:none;width:148px;border-radius:22px;background:var(--surface);border:1px solid var(--line);padding:14px 10px;display:grid;justify-items:center;gap:8px;text-align:center}
.cc .who{display:grid;justify-items:center;gap:4px;max-width:100%}
.cc .avatar{width:56px;height:56px;font-size:20px}
.cc b{font-size:14px;max-width:124px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc small{color:var(--muted);font-size:12px}

/* profile */
.pid{display:grid;justify-items:center;gap:6px;text-align:center;padding-block:4px 14px}
.pid h2{font-family:var(--f-display);font-size:22px;margin:6px 0 0;font-weight:600}
.pid p{margin:0;max-width:44ch}
.counts{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-weight:800;margin-block:4px 8px}
.counts small{color:var(--muted);font-weight:500;font-size:13px}
.ptabs{display:flex;justify-content:center;gap:28px;border-bottom:1px solid var(--line);margin-top:6px}
.ptabs button{padding:10px 2px 8px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.ptabs button.on{color:var(--fg);border-bottom-color:var(--fg)}

/* inbox */
.seg{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:999px;margin-block:10px 8px}
.seg button{flex:1;padding:9px;border-radius:999px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--fg)}
.ui{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;position:relative}
.ui .avatar{width:46px;height:46px}
.ui p{margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.ui small{color:var(--muted);display:block}
.ui .th{width:46px;height:58px;border-radius:12px;overflow:hidden;flex:none}
.ui .th>*{width:100%;height:100%;object-fit:cover}
.ui.unread p{font-weight:700}
.ui.unread::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.msgs{display:grid;gap:8px;padding-block:14px}
.bub{max-width:80%;padding:9px 15px;border-radius:20px;background:var(--surface2);width:fit-content;overflow-wrap:anywhere}
.bub.me{background:var(--accent);color:var(--accent-fg);margin-left:auto}
.compose{display:flex;gap:8px;padding-block:6px 10px}
.compose .in{flex:1;min-width:0}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
#modal.open{display:block}
#modal.open.bottom{display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){#modal.open.bottom{align-items:center}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);margin-inline:auto;max-width:480px;padding:26px;position:relative;animation:rise .35s both}
.sheet.wide{max-width:1040px;padding:0;overflow:hidden}
.bottom .sheet{width:100%}
.x{position:absolute;right:14px;top:14px;z-index:3;width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.x svg{width:16px;height:16px}
.sheet h3{font-family:var(--f-display);font-size:21px;margin:0 0 4px;font-weight:600;padding-right:40px}
.sheet .lead{color:var(--muted);margin:0 0 18px}
.detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
@media(max-width:760px){.detail{grid-template-columns:minmax(0,1fr)}}
.bigwrap{background:#000;min-width:0}
.big{height:clamp(320px,74vh,780px);display:block}
.big>*,.big .sl>*{width:100%;height:100%;object-fit:contain;display:block}
.big .slides{height:100%}
.bigwrap .dots{margin:0;padding:10px;background:var(--surface)}
.detail .info{padding:26px 24px;display:grid;gap:16px;align-content:start;min-width:0}
.detail h3{font-size:23px;overflow-wrap:anywhere}
.arow{display:flex;gap:10px;align-items:center;justify-content:space-between}
.who{display:flex;gap:10px;align-items:center;text-align:left;min-width:0}
.who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;color:var(--muted)}
.who>span:last-child{min-width:0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.more{padding:6px 18px 30px}
.more h4{font-family:var(--f-display);font-size:16px;margin:10px 0 0;font-weight:600}
.tag{padding:5px 12px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:700;color:var(--muted)}
label.f{display:grid;gap:6px;font-weight:700;font-size:13px;margin-bottom:14px}
.in,select.in,textarea.in{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding-inline:14px;font-size:16px}
textarea.in{height:auto;padding-block:10px;resize:vertical}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:0 0 10px}
.tabsx{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:999px;margin-bottom:18px}
.tabsx button{flex:1;padding:9px;border-radius:999px;font-weight:700;color:var(--muted)}
.tabsx button.on{background:var(--surface2);color:var(--fg)}
.drop{border:2px dashed var(--line);border-radius:22px;padding:30px 16px;text-align:center;color:var(--muted);cursor:pointer;display:block;margin-bottom:14px}
.drop.over,.drop:hover{border-color:var(--accent);color:var(--fg)}
.drop b{display:block;color:var(--fg);font-family:var(--f-display);font-weight:600;margin-bottom:4px}
.prev{border-radius:18px;overflow:hidden;margin-bottom:14px;background:#000;display:flex;gap:4px;overflow-x:auto;max-height:240px}
.prev>*{max-height:240px;max-width:100%;flex:none;object-fit:contain}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin-bottom:16px}
.chk input{margin-top:3px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.menu{max-width:440px;padding:18px 12px 14px}
.menu .mt{font-size:14px;padding:4px 44px 10px 12px;overflow-wrap:anywhere}
.mi{display:flex;width:100%;align-items:center;gap:12px;padding:14px 12px;border-radius:14px;font-weight:700;text-align:left}
.mi:hover{background:var(--surface2)}
.mi.danger{color:var(--danger)}

/* settings */
.set{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;margin-top:14px}
@media(max-width:760px){.set{grid-template-columns:minmax(0,1fr);gap:14px}}
.snav{display:grid;gap:4px;align-content:start;position:sticky;top:20px}
@media(max-width:760px){.snav{display:flex;overflow-x:auto;position:static;scrollbar-width:none}}
.snav button{text-align:left;padding:11px 14px;border-radius:14px;font-weight:700;color:var(--muted);white-space:nowrap}
.snav button.on{background:var(--surface);color:var(--fg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:24px;min-width:0}
.panel h3{font-family:var(--f-display);font-size:20px;margin:0 0 4px;font-weight:600}
.panel h6{margin:22px 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.panel .lead{color:var(--muted);margin:0 0 6px}
.acc{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.acc>.who,.acc>div:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.acc small{color:var(--muted);display:block}
.hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.hist button{aspect-ratio:1;border-radius:14px;overflow:hidden}
.hist svg,.hist img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;background:var(--surface2)}
.badge.ok{background:var(--accent);color:var(--accent-fg)}
.rules{padding-left:18px;color:var(--muted);display:grid;gap:8px}
.combos{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.cb{border-radius:18px;border:2px solid var(--line);padding:8px;display:grid;gap:8px;text-align:left;background:var(--bg)}
.cb i{display:block;height:52px;border-radius:11px}
.cb b{font-size:13px;padding-inline:4px}
.cb.on{border-color:var(--accent)}
.cust{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cust input[type=color]{width:56px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:3px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;z-index:90;opacity:0;pointer-events:none;transition:.3s;max-width:calc(100vw - 32px);text-align:center}
@media(min-width:900px){#toast{bottom:28px}}
#toast.show{opacity:1;transform:translate(-50%,0)}
#zen{position:fixed;inset:0;z-index:80;background:#05030c;display:none;cursor:pointer}
#zen.on{display:block}
#zen .lay{position:absolute;inset:0;animation:zin 1.6s both}
#zen svg{width:100%;height:100%}
@keyframes zin{from{opacity:0;transform:scale(1.06)}}
#zen .cap2{position:absolute;left:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));color:#fff;font-family:var(--f-display);text-shadow:0 2px 18px rgba(0,0,0,.6)}
#zen .cap2 small{display:block;font-family:var(--f-body);opacity:.7}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>

const hsl=(h,s,l)=>`hsl(${Math.round(h)},${Math.round(s)}%,${l}%)`;
function tokens(h1,h2,sat,bgS,dark){
  return dark?{
    '--bg':hsl(h1,bgS,4.5),'--surface':hsl(h1,bgS,9),'--surface2':hsl(h1,bgS,14.5),'--fg':hsl(h1,Math.min(bgS,30),95),'--muted':hsl(h1,Math.min(bgS,18),66),
    '--line':'rgba(255,255,255,.1)','--accent':hsl(h1,sat,68),'--accent2':hsl(h2,sat,72),'--accent-fg':hsl(h1,40,8),'--danger':'#ff6b81','--shadow':'0 18px 50px rgba(0,0,0,.5)'
  }:{
    '--bg':hsl(h1,bgS*.8,96),'--surface':'#ffffff','--surface2':hsl(h1,bgS*.8,92),'--fg':hsl(h1,Math.min(bgS+10,40),10),'--muted':hsl(h1,Math.min(bgS,18),37),
    '--line':'rgba(20,20,40,.12)','--accent':hsl(h1,sat,40),'--accent2':hsl(h2,sat,42),'--accent-fg':'#ffffff','--danger':'#d6334f','--shadow':'0 18px 50px rgba(30,30,60,.18)'
  };
}
function hexHsl(hex){
  const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  let h=0;if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}
  const l=(mx+mn)/2,s=d?d/(1-Math.abs(2*l-1)):0;return [h,s*100,l*100];
}
function curPal(){
  const p=DB.pal||{f:'Onyx',i:1};
  if(p.c){const a=hexHsl(p.c[0]),b=hexHsl(p.c[1]);return {h1:a[0],h2:b[0],sat:Math.max(55,Math.min(100,a[1])),bgS:28,name:'Custom'}}
  const f=FAMS.find(x=>x.k===p.f)||FAMS[0],c=f.combos[p.i]||f.combos[0];
  return {h1:c[1],h2:c[2],sat:f.sat,bgS:f.bgS,name:f.k+' · '+c[0]};
}
function isDark(){const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function applyPalette(){
  const c=curPal(),d=isDark(),tk=tokens(c.h1,c.h2,c.sat,c.bgS,d),st=document.documentElement.style;
  for(const k in tk)st.setProperty(k,tk[k]);

}

  return {id:'p'+i,seed:i*7919+13,cat,mood,h:SIZES[Math.floor(r()*SIZES.length)],

function art(p,k){
  k=k||0;
  const r=rng(p.seed+k*977),P=MOODS[p.mood],W=1000,H=p.h,g='g'+p.id+k;let s='';

  const ridge=(y,amp,col,op)=>{let d=`M0 ${H}L0 ${y}`;for(let i=1;i<=9;i++)d+=`L${i*W/9} ${y+(r()-.5)*amp}`;return `<path d="${d}L${W} ${H}Z" fill="${col}" opacity="${op||1}"/>`};

  const sunx=150+r()*700,suny=H*(.18+r()*.2),sr=70+r()*90;

      for(let i=0;i<22;i++)s+=`<ellipse cx="${r()*W}" cy="${r()*H*.85}" rx="${5+r()*7}" ry="${3+r()*4}" fill="#ffd9ea" opacity="${.5+r()*.5}" transform="rotate(${r()*180} ${r()*W} ${r()*H})"/>`;break;
    case 'Cinematic':{
      const hz=H*(.56+r()*.08),fx=W*(.22+r()*.56),fxp=W*(.28+r()*.44),sc=1.7+r()*.7,fy=H*.86;
      s=bg(P[4],P[2])+`<defs><radialGradient id="${g}c"><stop offset="0" stop-color="${P[0]}" stop-opacity=".95"/><stop offset="1" stop-color="${P[1]}" stop-opacity="0"/></radialGradient><radialGradient id="${g}v" cx=".5" cy=".5" r=".75"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".82"/></radialGradient><linearGradient id="${g}f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P[1]}" stop-opacity="0"/><stop offset=".5" stop-color="${P[1]}" stop-opacity=".4"/><stop offset="1" stop-color="${P[1]}" stop-opacity="0"/></linearGradient></defs>`;
      s+=`<ellipse cx="${fx}" cy="${hz}" rx="640" ry="200" fill="url(#${g}c)"/><ellipse cx="${fx}" cy="${hz}" rx="500" ry="5" fill="${P[0]}" opacity=".85"/><ellipse cx="${fx}" cy="${hz}" rx="240" ry="2" fill="#fff"/>`;
      s+=ridge(hz+14,120,'#08080f',.97)+`<rect y="${hz+10}" width="${W}" height="${H*.16}" fill="url(#${g}f)"/><rect y="${fy}" width="${W}" height="${H-fy}" fill="#050509"/>`;
      s+=`<g fill="#040408" transform="translate(${fxp} ${fy}) scale(${sc})"><circle cy="-168" r="15"/><path d="M-20 -150L-26 -60L-14 -60L-12 0L12 0L14 -60L26 -60L20 -150Z"/></g>`;
      for(let i=0;i<150;i++)s+=`<circle cx="${r()*W}" cy="${r()*H}" r="${.8+r()*.9}" fill="#fff" opacity="${.05+r()*.13}"/>`;
      s+=`<rect width="${W}" height="${H}" fill="url(#${g}v)"/>`;
      const sub=SUBS[Math.floor(r()*SUBS.length)];

      break}
    case 'Nature':

      for(let i=0;i<14;i++){const x=r()*W,y=H*(.6+r()*.35),h=40+r()*70;s+=`<path d="M${x} ${y}l${h*.28} ${h}h${-h*.56}z" fill="${P[4]}" opacity=".85"/>`}break;

      s+=`<circle cx="${W/2}" cy="${H/2}" r="${120+r()*90}" fill="none" stroke="#fff" stroke-width="2" opacity=".5"/>`;break;
    case 'Minimal':

    case 'Ocean':
      s=bg(P[0],P[1])+`<circle cx="${sunx}" cy="${suny}" r="${sr}" fill="#fff" opacity=".85"/>`;for(let q=0;q<7;q++){const y=H*(.42+q*.08),a=18+r()*30,f=.006+r()*.008,ph=r()*6;let d=`M0 ${H}L0 ${y}`;for(let x=0;x<=W;x+=20)d+=`L${x} ${y+Math.sin(x*f+ph)*a}`;s+=`<path d="${d}L${W} ${H}Z" fill="${P[Math.min(4,2+Math.floor(q/3))]}" opacity="${.55+q*.07}"/>`}break;

      for(let i=0;i<40;i++){const a=i/40*6.283,r1=90,r2=260+r()*220;s+=`<path d="M${W/2+Math.cos(a)*r1} ${H*.42+Math.sin(a)*r1}L${W/2+Math.cos(a)*r2} ${H*.42+Math.sin(a)*r2}" stroke="${P[0]}" stroke-width="1.5" opacity=".35"/>`}

/* ---------- cards and grid ---------- */
function slideEl(p,k,fit){
  if(p.up)return `<img src="${p.slides[k].src}" alt="${esc(p.title)}">`;
  const svg=art(p,k);return fit?svg.replace('xMidYMid slice','xMidYMid meet'):svg;
}
function mediaHTML(p,fit){
  if(p.up&&p.kind==='video')return fit?`<video src="${p.src}" controls playsinline></video>`:`<video src="${p.src}#t=0.1" muted playsinline preload="metadata"></video>`;
  const n=slidesN(p);
  if(n>1)return `<div class="slides">${Array.from({length:n},(_,k)=>`<div class="sl">${slideEl(p,k,fit)}</div>`).join('')}</div>`;
  return slideEl(p,0,fit);
}
const dotsHTML=n=>n>1?`<div class="dots">${Array.from({length:n},(_,k)=>`<i class="${k?'':'on'}"></i>`).join('')}</div>`:'';
function card(p,i){
  const a=me(),on=a&&a.saved.includes(p.id),vid=isVid(p),n=slidesN(p),daily=S.view==='home'&&S.cat==='All'&&p===dailyPin();
  return `<article class="pin${vid?' vid':''}" data-a="open" data-id="${p.id}" data-sr="1" tabindex="0" style="--ar:${arOf(p)};animation-delay:${Math.min(i,10)*35}ms">
   <div class="media">${mediaHTML(p)}${vid?`<span class="vbadge">${dur(p.dur||0)}</span>`:''}${daily?'<span class="tbadge">Zenaki Daily</span>':''}<button class="save ${on?'on':''}" data-a="save" data-id="${p.id}">${on?'Saved':'Save'}</button></div>
   ${dotsHTML(n)}
   <div class="cap"><span class="ttl">${esc(p.title)}</span><button class="mb" data-a="menu" data-id="${p.id}" aria-label="More options">${IC.more}</button></div></article>`;
}
let obs=null;
function mountGrid(host,list,topup,emptyHTML){
  S.list=list;S.shown=0;S.topup=topup||null;
  if(obs){obs.disconnect();obs=null}
  if(!list.length&&!topup){host.innerHTML=emptyHTML||'';return}
  host.innerHTML='<div class="grid" id="grid"></div><div id="sentinel"></div>';
  more();
  obs=new IntersectionObserver(es=>{if(es[0].isIntersecting)fill()},{rootMargin:'1000px'});obs.observe($('#sentinel'));
}
function more(){
  const g=$('#grid');if(!g)return 0;
  if(S.shown>=S.list.length&&S.topup)S.list=S.list.concat(S.topup());
  const batch=S.list.slice(S.shown,S.shown+20);
  if(!batch.length){const s=$('#sentinel');if(s)s.textContent=S.list.length?'You have seen everything here.':'';return 0}
  g.insertAdjacentHTML('beforeend',batch.map((p,i)=>card(p,i)).join(''));S.shown+=batch.length;return batch.length;
}
function fill(){for(let i=0;i<6;i++){const s=$('#sentinel');if(!s||s.getBoundingClientRect().top>innerHeight+1000)return;if(!more())return}}

/* ---------- home ---------- */
function catTabs(){
  const a=me(),t=taste(),base=CATS.filter(c=>c!=='Dark Art'||(a&&a.age18));
  const sorted=base.map((c,i)=>[c,t[c]||0,i]).sort((x,y)=>y[1]-x[1]||x[2]-y[2]).map(x=>x[0]);
  return ['All','Following',...sorted];
}
function renderTop(){
  const top=$('#top');top.hidden=false;
  top.innerHTML=`<button class="tlogo" data-a="nav" data-k="home" aria-label="Zenaki home"><img src="${LOGO}" alt="Zenaki"></button><div class="ttabs" role="tablist">${catTabs().map(c=>`<button role="tab" class="${S.cat===c?'on':''}" data-a="cat" data-k="${esc(c)}">${c==='Dark Art'?'Dark Art 18+':esc(c)}</button>`).join('')}</div><button class="zb" data-a="zen" aria-label="Zen mode" title="Zen mode">${IC.zen}</button>`;
}
function homeList(){
  const a=me(),t=taste();let l=[...UP,...ALL].filter(visible);
  if(S.cat==='Following'){const f=a?a.following:[];return l.filter(p=>f.includes(authorId(p))).sort((x,y)=>(y.t||0)-(x.t||0)||y.likes-x.likes)}
  if(S.cat!=='All')l=l.filter(p=>p.cat===S.cat);
  const sc=new Map(l.map(p=>[p.id,(t[p.cat]||0)*2+(t[p.mood]||0)+Math.log10(p.likes+1)*1.2+Math.random()*5+(p.up?4:0)]));
  l.sort((x,y)=>sc.get(y.id)-sc.get(x.id));
  if(S.cat==='All'){const d=dailyPin();if(visible(d)){l=l.filter(p=>p!==d);l.unshift(d)}}
  return l;
}
function topupHome(){
  let out=[];
  for(let k=0;k<6&&out.length<10;k++){const n0=ALL.length;extend(40);out=out.concat(ALL.slice(n0).filter(p=>visible(p)&&(S.cat==='All'||p.cat===S.cat)))}
  return out;
}
function suggestedCreators(){return AUTHORS.map(h=>'c:'+h).filter(id=>{const a=me();return !(a&&a.following.includes(id))}).slice(0,8)}
function personCard(id){
  const u=info(id),a=me();if(!u)return '';
  const own=a&&a.id===id,fol=a&&a.following.includes(id);
  return `<div class="cc"><button class="who" data-a="prof" data-id="${id}" style="flex-direction:column;text-align:center">${avatar(u)}<span><b>${esc(u.name)}</b><small>${fmt(u.followers)} followers</small></span></button>${own?'':`<button class="btn sm fbtn ${fol?'':'pri'}" data-a="follow" data-id="${id}">${fol?'Following':'Follow'}</button>`}</div>`;
}
function buildHome(){
  const a=me();
  let empty='<div class="empty"><b>No pins here yet</b>Try another tab.</div>';
  if(S.cat==='Following')empty=a?`<div class="empty"><b>Nothing from people you follow yet</b>Follow creators and their pins show up here.</div><h5 class="sec">Creators to follow</h5><div class="crow">${suggestedCreators().map(personCard).join('')}</div>`
    :'<div class="empty"><b>Log in to follow people</b><button class="btn pri" data-a="auth">Log in or sign up</button></div>';
  $('#main').innerHTML='<div id="gridhost"></div>';
  mountGrid($('#gridhost'),homeList(),S.cat==='Following'?null:topupHome,empty);
}

/* ---------- search ---------- */
function searchList(q){
  const w=q.toLowerCase().split(/\s+/).filter(Boolean);
  return [...UP,...ALL].filter(visible).filter(p=>{const hay=(p.title+' '+p.cat+' '+p.mood+' '+p.author+' '+p.tags.join(' ')).toLowerCase();return w.every(x=>hay.includes(x))}).sort((x,y)=>y.likes-x.likes);
}
function peopleFor(q){
  const w=q.toLowerCase();
  return [...DB.accounts.map(a=>a.id),...AUTHORS.map(h=>'c:'+h)].filter(id=>{const u=info(id);return u&&(u.handle.toLowerCase().includes(w)||u.name.toLowerCase().includes(w))}).slice(0,8);
}
function ideas(){
  const t=taste(),a=me(),pool=CATS.filter(c=>c!=='Dark Art'||(a&&a.age18)).concat(MOOD_NAMES,['sunset','sakura','moon','skyline','waves','galaxy','film still','neon city','wallpaper']);
  return pool.map(k=>[k,(t[k]||0)+Math.random()*5]).sort((x,y)=>y[1]-x[1]).slice(0,8).map(x=>x[0]);
}
function doSearch(q){
  q=q.trim();const a=me();
  if(a&&q){a.searches=[q,...a.searches.filter(x=>x!==q)].slice(0,15);const l=q.toLowerCase();CATS.concat(MOOD_NAMES).forEach(k=>{if(l.includes(k.toLowerCase()))a.taste[k]=(a.taste[k]||0)+3});persist()}
  if(S.view==='search'){S.query=q;window.scrollTo(0,0);render()}else navTo('search',{query:q});
}
function renderSearch(){
  const a=me(),q=S.query,chips=l=>l.map(r=>`<button class="chip" data-a="sq" data-k="${esc(r)}">${esc(r)}</button>`).join('');
  let h=`<div class="ph"><form id="sform" class="sbar" role="search" autocomplete="off">${sv('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>','class="ic"')}<input id="q" type="search" value="${esc(q)}" placeholder="Search pics, videos, creators" enterkeyhint="search" aria-label="Search"><button type="button" class="sx" data-a="sclear" aria-label="Clear" ${q?'':'hidden'}>${IC.x}</button></form></div>`;
  if(!q){
    const rec=a?a.searches.slice(0,6):[];
    const cats=CATS.filter(c=>c!=='Dark Art'||(a&&a.age18));
    h+=(rec.length?`<h5 class="sec">Recent</h5><div class="row">${chips(rec)}</div>`:'')
     +`<h5 class="sec">Ideas for you<small>new every time</small></h5><div class="row">${chips(ideas())}</div>`
     +`<h5 class="sec">Browse categories</h5><div class="tiles">${cats.map((c,i)=>`<button class="tile" data-a="sq" data-k="${c}">${art({id:'t'+i,seed:num(c)+7,cat:c,mood:MOOD_NAMES[(i*2)%6],h:1000},0)}<span>${c}</span></button>`).join('')}</div>`
     +`<h5 class="sec">Browse by mood</h5><div class="tiles">${MOOD_NAMES.map(m=>`<button class="tile" data-a="sq" data-k="${m}" style="background:linear-gradient(135deg,${MOODS[m][0]},${MOODS[m][2]} 55%,${MOODS[m][4]})"><span>${m}</span></button>`).join('')}</div>`;
    $('#main').innerHTML=h;
    if(matchMedia('(hover:hover)').matches){const i=$('#q');i&&i.focus({preventScroll:true})}
  }else{
    const list=searchList(q),ppl=peopleFor(q);
    h+=`<div class="head"><h2>Most loved for “${esc(q)}”</h2><p>${list.length} pins, most popular first. Open one to download it.</p></div>`
      +(ppl.length?`<h5 class="sec">People</h5><div class="crow">${ppl.map(personCard).join('')}</div>`:'')+'<div id="gridhost"></div>';
    $('#main').innerHTML=h;
    mountGrid($('#gridhost'),list,null,'<div class="empty"><b>No pins found</b>Try neon, ocean, cinematic or anime.</div>');
  }
}

/* ---------- inbox ---------- */
function convos(a){
  const m=DB.msgs.filter(x=>x.from===a.id||x.to===a.id),ids=[...new Set(m.map(x=>x.from===a.id?x.to:x.from))];
  return ids.map(id=>{const mm=m.filter(x=>x.from===id||x.to===id);return {id,last:mm.slice().sort((p,q)=>q.t-p.t)[0],unread:mm.filter(x=>x.from===id&&!x.read).length}}).sort((p,q)=>q.last.t-p.last.t);
}
function renderInbox(){
  const a=me();
  if(!a){$('#main').innerHTML='<div class="empty"><b>Log in to see your inbox</b><button class="btn pri" data-a="auth">Log in or sign up</button></div>';return}
  const th=S.thread&&info(S.thread);
  let h='';
  if(S.itab==='messages'&&th){
    DB.msgs.forEach(m=>{if(m.to===a.id&&m.from===S.thread)m.read=true});persist();
    const ms=DB.msgs.filter(m=>(m.from===a.id&&m.to===S.thread)||(m.from===S.thread&&m.to===a.id)).sort((x,y)=>x.t-y.t);
    h=`<div class="ph"><button class="ibtn" data-a="thread" data-id="" aria-label="Back">${IC.back}</button><button class="who" data-a="prof" data-id="${S.thread}">${avatar(th,'sm')}<span><b>${esc(th.name)}</b><small>@${esc(th.handle)}</small></span></button></div>
     <div class="msgs">${ms.length?ms.map(m=>`<div class="bub ${m.from===a.id?'me':''}">${esc(m.text)}</div>`).join(''):'<p class="stat">Say hello.</p>'}</div>
     <form id="mf" class="compose"><input class="in" id="mt" required maxlength="500" placeholder="Write a message" aria-label="Message"><button class="btn pri" type="submit">Send</button></form>`;
  }else{
    h=`<div class="ph"><h2>Inbox</h2></div><div class="seg"><button data-a="itab" data-k="updates" class="${S.itab==='updates'?'on':''}">Updates</button><button data-a="itab" data-k="messages" class="${S.itab==='messages'?'on':''}">Messages</button></div>`;
    if(S.itab==='updates'){
      const ev=DB.inbox[a.id]||[];
      h+=ev.length?`<div>${ev.map(e=>{
        const from=e.from?info(e.from):null,pin=e.pin?find(e.pin):null;
        const act=e.type==='follow'&&from?`data-a="prof" data-id="${e.from}"`:pin?`data-a="open" data-id="${e.pin}"`:'';
        const thumb=pin?(pin.up?(pin.kind==='image'?`<img src="${pin.slides[0].src}" alt="">`:''):art(pin,0)):'';
        return `<button class="ui ${e.read?'':'unread'}" ${act}>${from?avatar(from):`<span class="avatar sys">${IC.zen}</span>`}<p>${esc(e.text)}<small>${ago(e.t)}</small></p>${thumb?`<span class="th">${thumb}</span>`:''}</button>`}).join('')}</div>`
        :'<div class="empty"><b>No updates yet</b>New followers and likes show up here.</div>';
      ev.forEach(e=>e.read=true);persist();
    }else{
      const cv=convos(a);
      h+=`<div class="row" style="margin-bottom:8px"><button class="btn sm pri" data-a="newmsg">New message</button></div>`+(cv.length?`<div>${cv.map(c=>{const u=info(c.id);return u?`<button class="ui ${c.unread?'unread':''}" data-a="thread" data-id="${c.id}">${avatar(u)}<p>${esc(u.name)}<small>${esc(c.last.text.slice(0,60))} · ${ago(c.last.t)}</small></p></button>`:''}).join('')}</div>`
        :'<div class="empty"><b>No messages yet</b>Message people you follow. On this demo that works between accounts on this device.</div>');
    }
  }
  $('#main').innerHTML=h;renderNav();
}

/* ---------- profile ---------- */

  if(!u){$('#main').innerHTML='<div class="empty"><b>Profile not found</b></div>';return}

  if(!own&&S.ptab!=='pins')S.ptab='pins';
  const tabs=own?[['pins','Pins'],['saved','Saved'],['liked','Liked']]:[['pins','Pins']];
  const list=(S.ptab==='saved'?a.saved.map(find):S.ptab==='liked'?a.liked.map(find):pinsBy(id)).filter(p=>p&&visible(p));
  $('#main').innerHTML=`<div class="ph">${S.stack.length?`<button class="ibtn" data-a="back" aria-label="Back">${IC.back}</button>`:''}<span style="flex:1"></span>${own?`<button class="ibtn" data-a="opensettings" aria-label="Settings">${IC.gear}</button>`:''}</div>
   <div class="pid">${avatar(u,'xl')}<h2>${esc(u.name)}</h2><span class="stat">@${esc(u.handle)}</span>${u.bio?`<p>${esc(u.bio)}</p>`:''}
    <div class="counts"><button data-a="people" data-k="followers" data-id="${id}">${fmt(u.followers)} <small>followers</small></button><button data-a="people" data-k="following" data-id="${id}">${fmt(u.following)} <small>following</small></button><span>${pinsBy(id).length} <small>pins</small></span></div>
    <div class="row" style="justify-content:center">${own?`<button class="btn" data-a="editprof">Edit profile</button><button class="btn ghost" data-a="opensettings">Settings</button>`
      :`<button class="btn fbtn ${fol?'':'pri'}" data-a="follow" data-id="${id}">${fol?'Following':'Follow'}</button>${u.isCreator?'':`<button class="btn" data-a="msg" data-id="${id}">Message</button>`}`}</div></div>

function peopleModal(kind,id){
  const u=info(id);if(!u)return;

  const ids=kind==='following'?(acc?acc.following:[]):DB.accounts.filter(x=>x.following.includes(id)).map(x=>x.id);
  const a=me();
  openModal(`<div class="sheet"><button class="x" data-a="close" aria-label="Close">${IC.x}</button><h3>${kind==='following'?'Following':'Followers'}</h3><p class="lead">${esc(u.name)}</p>
   ${ids.length?ids.map(x=>{const v=info(x);if(!v)return '';const f=a&&a.following.includes(x);return `<div class="acc"><button class="who" data-a="prof" data-id="${x}">${avatar(v)}<span><b>${esc(v.name)}</b><small>@${esc(v.handle)}</small></span></button>${a&&a.id===x?'':`<button class="btn sm fbtn ${f?'':'pri'}" data-a="follow" data-id="${x}">${f?'Following':'Follow'}</button>`}</div>`}).join(''):`<p class="stat">${kind==='following'&&u.isCreator?'This creator keeps their list private.':'Nobody here yet.'}</p>`}
   ${u.isCreator&&kind==='followers'?`<p class="stat">Showing people on this device. ${fmt(u.followers)} follow this creator in total.</p>`:''}</div>`);
}

/* ---------- nav and render ---------- */
function renderNav(){
  const a=me(),v=S.view,un=a?unreadCount(a):0,own=v==='profile'&&a&&S.prof===a.id;
  const b=(k,lbl,icon,on,dot)=>`<button class="nb${on?' on':''}${k==='settings'?' sett':''}" data-a="nav" data-k="${k}" aria-label="${lbl}"${on?' aria-current="page"':''}>${icon}<span class="lbl">${lbl}</span>${dot?'<i class="dot"></i>':''}</button>`;
  $('#nav').innerHTML=`<a class="logo" href="#" data-a="nav" data-k="home" aria-label="Zenaki home"><img src="${LOGO}" alt="Zenaki"></a>`
   +b('home','Home',IC.home,v==='home')+b('search','Search',IC.search,v==='search')+b('create','Create',IC.plus,false)+b('inbox','Inbox',IC.chat,v==='inbox',un>0)
   +b('profile','Profile',a?`<span class="av">${esc(a.name[0].toUpperCase())}</span>`:IC.user,own)+'<span class="sp"></span>'+b('settings','Settings',IC.gear,v==='settings');
}
function render(){
  if(S.view==='home'&&S.cat!=='All'&&S.cat!=='Following'&&!catTabs().includes(S.cat))S.cat='All';
  renderNav();
  if(S.view==='home'){renderTop();buildHome()}
  else{const t=$('#top');t.hidden=true;t.innerHTML='';({search:renderSearch,inbox:renderInbox,profile:renderProfile,settings:renderSettings}[S.view]||renderSearch)()}
}

/* ---------- modals ---------- */
const modal=$('#modal');
function openModal(html,cls){modal.innerHTML=html;modal.className='open'+(cls?' '+cls:'');modal.scrollTop=0;document.body.style.overflow='hidden'}
function closeModal(){modal.className='';modal.innerHTML='';document.body.style.overflow=''}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}

function openPin(id){
  const p=find(id);if(!p)return;
  const a=me();
  if(a){a.history=[id,...a.history.filter(x=>x!==id)].slice(0,40);bump(p,1)}
  const on=a&&a.saved.includes(id),lk=a&&a.liked.includes(id),aid=authorId(p),u=info(aid),own=a&&a.id===aid,fol=a&&a.following.includes(aid),n=slidesN(p);

async function saveFile(name,blob,url){
  /* inside the Claude viewer the page asks the viewer to save; on a normal website a plain download link works */
  let dl=null;
  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}
  if(dl){
    try{await dl.save({filename:name,data:blob});toast('Saved. Check your downloads or gallery.')}
    catch(e){const c=e&&e.code;toast(c==='declined'?'Download cancelled':c==='rejected_extension'?'This file type cannot be saved here':c==='rate_limited'?'One moment, then try again':'Could not save this file')}
    return;
  }
  const l=document.createElement('a');l.href=url||URL.createObjectURL(blob);l.download=name;document.body.appendChild(l);l.click();l.remove();toast('Download started');
}
async function download(p,k){
  k=k||0;const a=me(),q=(a&&a.q)||'orig';
  try{
    const name=(slug(p.title).replace(/\./g,'-')||'zenaki')+'-zenaki'+(slidesN(p)>1?'-'+(k+1):'');
    if(p.up){
      const vid=p.kind==='video',f=vid?p.file:p.slides[k].file,ext=vid?(p.ext||'mp4'):(p.slides[k].ext||'jpg');
      return saveFile(name+'.'+ext,f,vid?p.src:p.slides[k].src);
    }
    const svg=art(p,k);
    if(q==='svg')return saveFile(name+'.svg',new Blob([svg],{type:'image/svg+xml'}));
    const sizes=[q==='hd'?1080:q==='4k'?2160:4096,2160],u=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
    const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=u});
    let blob=null;
    for(const Wd of sizes){
      try{const c=document.createElement('canvas');c.width=Wd;c.height=Math.round(Wd*p.h/1000);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        blob=await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(),'image/png'));break}catch(e){blob=null}
    }
    URL.revokeObjectURL(u);
    if(!blob)throw new Error('canvas');
    return saveFile(name+'.png',blob);
  }catch(e){toast('Could not download this one. Try again.')}
}

/* ---------- upload (pictures, carousels, video up to 10 min) ---------- */
let pending=null;
const loadImg=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>ok({src:u,file:f,ar:im.naturalWidth/im.naturalHeight,ext:(f.name.split('.').pop()||'jpg').toLowerCase()});im.onerror=()=>no(new Error('img'));im.src=u});
const loadVid=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>ok({src:u,file:f,dur:Math.round(v.duration),ar:(v.videoWidth/v.videoHeight)||1.78,ext:(f.name.split('.').pop()||'mp4').toLowerCase()});v.onerror=()=>no(new Error('vid'));v.src=u});
function uploadModal(){
  const a=me();if(!a){toast('Sign up first to create pins');authModal('signup');return}
  pending=null;
  openModal(`<div class="sheet"><button class="x" data-a="close" aria-label="Close">${IC.x}</button>
   <h3>Create a pin</h3><p class="lead">Up to 10 pictures in one pin, or one video up to 10 minutes. Everything is public.</p>
   <form id="uf"><label class="drop" id="drop"><input type="file" id="file" accept="image/*,video/*" multiple hidden><b>Drop files or tap to choose</b>Anime art, cinematic frames, edits, photos or a video</label>
   <div id="prevbox"></div>
   <label class="f">Title<input class="in" id="ut" required maxlength="60" placeholder="Name your pin"></label>
   <label class="f">Category<select class="in" id="uc">${CATS.filter(c=>c!=='Dark Art'||a.age18).map(c=>`<option>${c}</option>`).join('')}</select></label>
   <label class="f">Mood<select class="in" id="um">${MOOD_NAMES.map(c=>`<option>${c}</option>`).join('')}</select></label>
   <label class="f">Tags (comma separated)<input class="in" id="ug" placeholder="sunset, wallpaper"></label>
   <label class="chk"><input type="checkbox" id="uok" required>I confirm this has no nudity or sexual content, and I own it or have permission to share it.</label>
   <p class="err" id="uerr"></p>
   <button class="btn pri" style="width:100%" type="submit">Publish</button></form></div>`);
  const drop=$('#drop'),inp=$('#file');
  inp.addEventListener('change',()=>take(inp.files));
  ['dragenter','dragover'].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.add('over')}));
  ['dragleave','drop'].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.remove('over')}));
  drop.addEventListener('drop',e=>take(e.dataTransfer.files));
}
async function take(files){
  const err=$('#uerr');err.textContent='';files=[...files||[]];if(!files.length)return;
  const vids=files.filter(f=>f.type.startsWith('video/')),imgs=files.filter(f=>f.type.startsWith('image/'));
  if(!vids.length&&!imgs.length){err.textContent='Please choose pictures or a video.';return}
  if(files.some(f=>f.size>300*1024*1024)){err.textContent='A file is over 300 MB. Choose a smaller one.';return}
  try{
    if(vids.length){
      const v=await loadVid(vids[0]);
      if(v.dur>600){err.textContent='This video is '+dur(v.dur)+' long. The limit is 10:00.';pending=null;$('#prevbox').innerHTML='';return}
      pending={kind:'video',src:v.src,file:v.file,ar:v.ar,dur:v.dur,ext:v.ext};
      $('#prevbox').innerHTML=`<div class="prev"><video src="${v.src}" controls playsinline></video></div>`;
    }else{
      const sl=await Promise.all(imgs.slice(0,10).map(loadImg));
      pending={kind:'image',slides:sl,ar:sl[0].ar};
      $('#prevbox').innerHTML=`<div class="prev">${sl.map(s=>`<img src="${s.src}" alt="">`).join('')}</div>`;
      if(imgs.length>10)err.textContent='Only the first 10 pictures were added.';
    }
  }catch(e){pending=null;err.textContent='This file could not be read by your browser.'}
}
function publish(){
  const a=me(),err=$('#uerr');if(!pending){err.textContent='Choose a file first.';return}
  const tags=$('#ug').value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean).slice(0,8),cat=$('#uc').value,mood=$('#um').value;
  const p=Object.assign({id:'u'+Date.now(),up:true,owner:a.id,t:Date.now(),author:a.handle,title:$('#ut').value.trim(),cat,mood,likes:0,tags:[cat.toLowerCase(),mood.toLowerCase(),...tags]},pending);
  UP.unshift(p);IDX.set(p.id,p);bump(p,4);
  DB.accounts.filter(x=>x.following.includes(a.id)).forEach(x=>notify(x.id,{type:'post',from:a.id,pin:p.id,text:`${a.name} posted a new pin: ${p.title}`}));
  persist();closeModal();toast('Published! Everyone can see it now.');navTo('profile',{prof:a.id,ptab:'pins'});
}

function follow(id){
